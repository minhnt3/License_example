name: Check Review Comments and Mentions

on:
  pull_request:
    types: [opened, edited, synchronize]

env:
  REVIEWER_USERNAME: "minhnt3"

jobs:
  check-review-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and check review comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}
          MENTION_PATTERN="@${REVIEWER_USERNAME}"

          # Lấy PR author
          PR_AUTHOR=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '.user.login')
          echo "👤 PR Author: $PR_AUTHOR"

          # Lấy tất cả review comments
          gh api repos/$REPO/pulls/$PR_NUMBER/comments \
            --paginate \
            > all_comments.json

          # Lọc comment gốc KHÔNG phải từ PR author
          jq --arg author "$PR_AUTHOR" '[.[] | select(.in_reply_to_id == null and .user.login != $author)]' all_comments.json > root_comments.json
          ROOT_COUNT=$(jq length root_comments.json)
          echo "🔢 Total Root Review Comments (excluding PR author): $ROOT_COUNT"

          # Đếm số lần mention reviewer
          MENTION_COUNT=$(jq --arg mention "$MENTION_PATTERN" '[.[] | select(.body | test($mention))] | length' all_comments.json)
          echo "🔁 Number of $MENTION_PATTERN mentions: $MENTION_COUNT"

          # So sánh
          if [ "$MENTION_COUNT" -lt "$ROOT_COUNT" ]; then
            echo "❌ Not enough $MENTION_PATTERN mentions for $ROOT_COUNT root comments."
            exit 1
          else
            echo "✅ All root comments (excluding PR author) are properly mentioned."
          fi
