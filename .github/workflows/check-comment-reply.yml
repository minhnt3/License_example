name: List Review Comments Only (Filtered)

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  list-review-comments:
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Get PR Review Comments (exclude bots + general comments)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          echo "Fetching review comments for PR #$PR_NUMBER..."

          gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/comments \
            --paginate \
            --jq '
              map(select(
                (.user.login != "coderabbitai[bot]") and 
                (.user.login != "Copilot") and 
                (.path != null) and 
                (.line != null)
              )) |
              .[] |
              "- Author: \(.user.login)
                 File: \(.path)
                 Line: \(.line)
                 Comment: \(.body)\n"
            ' > review_comments_filtered.txt

          echo "=== Filtered Review Comments ==="
          cat review_comments_filtered.txt
