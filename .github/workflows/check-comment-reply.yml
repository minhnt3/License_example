name: List All PR Comments

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  list-comments:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Get all review comments (code-specific)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          echo "Fetching review comments for PR #$PR_NUMBER..."
          
          gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/comments \
            --paginate \
            --jq '.[] | 
              "- Author: \(.user.login)
                 File: \(.path)
                 Line: \(.line)
                 In-Reply-To: \(.in_reply_to_id // "None")
                 Comment: \(.body)\n"' > review_comments.txt
          
          echo "=== Review Comments ==="
          cat review_comments.txt
