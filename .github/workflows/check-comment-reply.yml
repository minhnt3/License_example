name: Check Review Comments and Mentions

on:
  pull_request:
    types: [opened, edited, synchronize]

env:
  REVIEWER_USERNAME: "minhnt3"

jobs:
  check-review-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and check review comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          MENTION_PATTERN="@${REVIEWER_USERNAME}"
          echo "🔍 Checking comments for @$REVIEWER_USERNAME..."

          # Fetch all review comments
          gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/comments \
            --paginate \
            > all_comments.json

          # Filter root comments (non-replies)
          jq '[.[] | select(.in_reply_to_id == null)]' all_comments.json > root_comments.json
          ROOT_COUNT=$(jq length root_comments.json)
          echo "🔢 Total Root Review Comments: $ROOT_COUNT"

          # Count mentions of @REVIEWER_USERNAME in all comments
          MENTION_COUNT=$(jq --arg mention "$MENTION_PATTERN" '[.[] | select(.body | test($mention))] | length' all_comments.json)
          echo "🔁 Number of $MENTION_PATTERN mentions: $MENTION_COUNT"

          # Fail/pass condition
          if [ "$MENTION_COUNT" -lt "$ROOT_COUNT" ]; then
            echo "❌ Not enough $MENTION_PATTERN mentions for $ROOT_COUNT root comments."
            exit 1
          else
            echo "✅ All root comments are properly mentioned."
          fi
