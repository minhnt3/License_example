name: List Root PR Comments and Check Mentions

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  list-comments:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Get review comments and count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          echo "Fetching review comments for PR #$PR_NUMBER..."

          # Fetch all code review comments
          gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/comments \
            --paginate \
            > all_comments.json

          # Filter to only root comments (not replies)
          jq '[.[] | select(.in_reply_to_id == null)]' all_comments.json > root_comments.json

          # Count root comments
          ROOT_COUNT=$(jq length root_comments.json)
          echo "🔢 Total Root Review Comments: $ROOT_COUNT"

          # Count @minhnt3 mentions in ALL comments (including replies)
          MENTION_COUNT=$(jq '[.[] | select(.body | test("@minhnt3"))] | length' all_comments.json)
          echo "🔁 Number of @minhnt3 mentions: $MENTION_COUNT"

          # Output detailed list (optional)
          echo "=== Root Comments ==="
          jq -r '.[] |
            "- Author: \(.user.login)
               File: \(.path)
               Line: \(.line)
               Comment: \(.body)\n"
          ' root_comments.json

          # Fail or pass CI based on condition
          if [ "$MENTION_COUNT" -lt "$ROOT_COUNT" ]; then
            echo "❌ Not enough @minhnt3 mentions for review comments."
            exit 1
          else
            echo "✅ All root comments are mentioned appropriately."
          fi
