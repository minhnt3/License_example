name: AI Generate PR Description

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  generate-description:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: ⬇️ Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Get commit messages
        id: commits
        run: |
          COMMITS=$(git log origin/${{ github.base_ref }}..HEAD --pretty=format:"%s")
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🤖 Ask OpenAI to summarize commits
        id: summary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Asking GPT to summarize the following commits:"
          echo "${{ steps.commits.outputs.commits }}"

          SUMMARY=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-4",
              "messages": [
                {"role": "system", "content": "You are a software engineer. Summarize git commit messages into clear bullet points for a changelog."},
                {"role": "user", "content": "Summarize the following commits:\n'"${{ steps.commits.outputs.commits }}"'"}
              ],
              "temperature": 0.5
            }' | jq -r '.choices[0].message.content')

          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 📝 Update PR description
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title;
            const branch = pr.head.ref;
            const issueNumber = title.match(/^(\d+):/)?.[1] || '';
            const summary = `${{ steps.summary.outputs.summary }}`.trim();

            const description = `
                [${branch}: ${title}]

                ## Issue
                #${issueNumber}

                ## Overview/Summary
                ${summary}

                ## Breaking Changes
                - [List any changes that might cause errors in existing code]
                - [Include modifications to shared components, models, or utilities]
                - [Note any deprecated or removed functionality]
                - [Highlight changes to public APIs or interfaces]

                ## Screenshots (only UI that do not have golden images)

                | State     | Screenshot                    | Note  |
                |---------- |----------------------------   |------ |
                | Enabled   | <img src="" width="300" />    |       |

                ## Note
                `;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: description
            });
