name: 🤖 AI Generate PR Description

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  generate-description:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: ⬇️ Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Get git diff between branches
        id: diff
        run: |
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD --unified=0 | head -n 300)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🤖 Ask OpenAI to summarize the PR
        id: summary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Asking GPT to summarize PR changes..."

          DIFF="${{ steps.diff.outputs.diff }}"

          SUMMARY=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
            {
            "model": "gpt-4",
            "messages": [
                {
                "role": "system",
                "content": "You are a senior software engineer. Summarize the PR code diff below into clear bullet points for a PR description. Be concise and highlight what was changed and why."
                },
                {
                "role": "user",
                "content": "Git diff:\n${DIFF}"
                }
            ],
            "temperature": 0.4
            }
            EOF
          | jq -r '.choices[0].message.content')

          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 📝 Update PR description
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ steps.summary.outputs.summary }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title;
            const branch = pr.head.ref;
            const issueNumber = title.match(/^(\d+):/)?.[1] || '';
            const summary = process.env.SUMMARY.trim();

            const description =
              `[${branch}: ${title}]\n\n` +
              `## Issue\n` +
              `#${issueNumber}\n\n` +
              `## Overview/Summary\n` +
              `${summary}\n\n` +
              `## Breaking Changes\n` +
              `- [List any changes that might cause errors in existing code]\n` +
              `- [Include modifications to shared components, models, or utilities]\n` +
              `- [Note any deprecated or removed functionality]\n` +
              `- [Highlight changes to public APIs or interfaces]\n\n` +
              `## Screenshots (only UI that do not have golden images)\n\n` +
              `| State     | Screenshot                 | Note  |\n` +
              `|---------- |----------------------------|-------|\n` +
              `| Enabled   | <img src="" width="300" /> |       |\n\n` +
              `## Note`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: description
            });
