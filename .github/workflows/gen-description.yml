name: 🤖 AI Generate PR Description # Workflow name for easy identification

on:
  pull_request:
    types: [opened, synchronize] # Triggers when a pull request is opened or synchronized (new commits pushed)

jobs:
  generate-description:
    runs-on: ubuntu-latest # Specifies the runner environment

    permissions:
      pull-requests: write # Grants permission to update pull request descriptions
      contents: read # Grants permission to read repository content (for git diff)

    steps:
      - name: ⬇️ Checkout full history
        uses: actions/checkout@v4 # Uses the official GitHub action to check out the repository
        with:
          fetch-depth: 0 # Fetches the entire commit history, necessary for accurate diffing

      - name: 🔍 Get git diff between branches
        id: diff # Assigns an ID to this step to reference its outputs later
        run: |
          # Generates a unified git diff between the base branch and the head of the PR
          # Limits the diff to 300 lines to avoid excessively large prompts for the AI
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD --unified=0 | head -n 300)
          echo "diff<<EOF" >> $GITHUB_OUTPUT # Starts a multi-line string for the 'diff' output
          echo "$DIFF" >> $GITHUB_OUTPUT # Adds the generated diff to the output
          echo "EOF" >> $GITHUB_OUTPUT # Ends the multi-line string

      - name: 🤖 Ask OpenAI to summarize the PR
        id: summary # Assigns an ID to this step
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # Accesses the OpenAI API key from GitHub secrets
        run: |
          echo "Asking GPT to summarize PR changes..."

          DIFF="${{ steps.diff.outputs.diff }}" # Retrieves the diff output from the previous step
          SAFE_DIFF=$(jq -Rs <<< "$DIFF") # Safely encodes the diff for JSON inclusion

          # Makes a POST request to the OpenAI API to get a summary
          SUMMARY=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
            {
              "model": "gpt-4", # Specifies the OpenAI model to use
              "messages": [
                {
                  "role": "system",
                  "content": "You are a senior software engineer. Summarize the PR code diff below into clear bullet points for a PR description. Be concise and highlight what was changed and why."
                },
                {
                  "role": "user",
                  "content": ${SAFE_DIFF}
                }
              ],
              "temperature": 0.4 # Controls the randomness of the AI's output
            }
            EOF
            | jq -r '.choices[0].message.content') # Parses the JSON response to extract the summary

          echo "summary<<EOF" >> $GITHUB_OUTPUT # Starts a multi-line string for the 'summary' output
          echo "$SUMMARY" >> $GITHUB_OUTPUT # Adds the AI-generated summary to the output
          echo "EOF" >> $GITHUB_OUTPUT # Ends the multi-line string

      - name: 📝 Update PR description
        uses: actions/github-script@v7 # Uses the GitHub Script action to interact with the GitHub API
        env:
          SUMMARY: ${{ steps.summary.outputs.summary }} # Passes the AI-generated summary as an environment variable
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title;
            const branch = pr.head.ref;
            # Extracts the issue number from the PR title, if present
            const issueNumber = title.match(/^(\d+):/)?.[1] || '';
            const summary = process.env.SUMMARY.trim();

            # Constructs the full PR description with predefined sections
            const description =
              `[${branch}: ${title}]\n\n` +
              `## Issue\n` +
              `#${issueNumber}\n\n` +
              `## Overview/Summary\n` +
              `${summary}\n\n` +
              `## Breaking Changes\n` +
              `- [List any changes that might cause errors in existing code]\n` +
              `- [Include modifications to shared components, models, or utilities]\n` +
              `- [Note any deprecated or removed functionality]\n` +
              `- [Highlight changes to public APIs or interfaces]\n\n` +
              `## Screenshots (only UI that do not have golden images)\n\n` +
              `| State     | Screenshot                 | Note  |\n` +
              `|---------- |----------------------------|-------|\n` +
              `| Enabled   | <img src="" width="300" /> |       |\n\n` +
              `## Note`;

            # Updates the pull request description using the GitHub API
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: description
            });