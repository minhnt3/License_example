name: Check PR Title

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-conventions:
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Check PR title
        run: |
          echo "🔎 Checking PR title: ${{ github.event.pull_request.title }}"
          TITLE="${{ github.event.pull_request.title }}"
          if [[ ! "$TITLE" =~ ^[0-9]+:\ .+ ]]; then
            echo "❌ Invalid PR title convention: '$TITLE'"
            echo "✅ Expected format: 'feat: something here'"
            exit 1
          fi
          echo "✅ PR title is valid."
