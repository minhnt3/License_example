name: 🔁 Update Project Status on PR

on:
  pull_request:
    types: [opened, closed]

jobs:
  update-project-status:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event.action == 'opened'

    steps:
      - name: 🔐 Set GraphQL Token
        run: echo "GRAPHQL_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: 🔍 Extract Issue Numbers from PR body
        id: extract
        run: |
          ISSUE_BLOCK=$(echo "${{ github.event.pull_request.body }}" | awk '/^## Issue/{flag=1;next}/^##/{flag=0}flag')
          NUMBERS=$(echo "$ISSUE_BLOCK" | grep -oE '#[0-9]+' | sed 's/#//g' | tr '\n' ',' | sed 's/,$//')
          echo "issues=$NUMBERS" >> $GITHUB_OUTPUT

      - name: 🔁 Update Status in Project (GraphQL)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=',' read -ra ISSUE_IDS <<< "${{ steps.extract.outputs.issues }}"

          for ISSUE_NUMBER in "${ISSUE_IDS[@]}"; do
            echo "Fetching content ID for issue #$ISSUE_NUMBER..."

            CONTENT_ID=$(gh api graphql -f query='
              query($owner:String!, $repo:String!, $issue:Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $issue) {
                    id
                  }
                }
              }' -f owner="${{ github.repository_owner }}" -f repo="${{ github.event.repository.name }}" -F issue=$ISSUE_NUMBER --jq '.data.repository.issue.id')

            echo "Content ID: $CONTENT_ID"

            echo "Updating Project status..."

            # Replace the following with your actual project/field/option IDs
            gh api graphql -f query='
              mutation {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: "PVT_kwHOBZLEic4A6UIE",
                    itemId: "'$CONTENT_ID'",
                    fieldId: "PVTSSF_lAHOBZLEic4A6UIEzgu8fD0",
                    value: {
                      singleSelectOptionId: "34aa8716"
                    }
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }'
          done