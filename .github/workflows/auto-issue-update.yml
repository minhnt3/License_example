name: Sync Issue Status with PR

on:
  pull_request:
    types: [opened, edited, closed]

jobs:
  sync-issues:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged != false || github.event.action == 'opened' || github.event.action == 'edited'

    permissions:
      issues: write
      pull-requests: read

    steps:
      - name: 🧠 Extract Issue Numbers from PR Description
        id: extract
        run: |
          echo "PR Body:"
          echo "${{ github.event.pull_request.body }}"

          # Extract only the block under '## Issue'
          ISSUE_BLOCK=$(echo "${{ github.event.pull_request.body }}" | awk '/^## Issue/{flag=1;next}/^##/{flag=0}flag')
          
          echo "Issue block content:"
          echo "$ISSUE_BLOCK"

          # Extract issue numbers starting with #
          NUMBERS=$(echo "$ISSUE_BLOCK" | grep -oE '#[0-9]+' | sed 's/#//g' | tr '\n' ',' | sed 's/,$//')
          echo "issues=$NUMBERS" >> $GITHUB_OUTPUT

      - name: 📝 Set Issue Status to 'Code Review' when PR is opened or edited
        if: github.event.action == 'opened' || github.event.action == 'edited'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = '${{ steps.extract.outputs.issues }}'.split(',').filter(Boolean);
            for (const number of issues) {
              await github.rest.issues.createComment({
                issue_number: parseInt(number),
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '🔄 This issue is currently in **Code Review** via PR #' + context.payload.pull_request.number
              });
            }

      - name: ✅ Close Issues When PR Is Merged
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        uses: actions/github-script@v7
        with:
          script: |
            const issues = '${{ steps.extract.outputs.issues }}'.split(',').filter(Boolean);
            for (const number of issues) {
              await github.rest.issues.update({
                issue_number: parseInt(number),
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed'
              });
            }
