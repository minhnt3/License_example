name: Check Issue Status in Project

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  verify-issue-status:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # hoặc dùng secrets.PROJECT_PAT nếu cần scope rộng hơn
    steps:
      - name: 🔍 Extract Issue Numbers from Description
        id: extract
        run: |
          ISSUE_SECTION=$(echo "${{ github.event.pull_request.body }}" | awk '/## Issue/{flag=1;next}/##/{flag=0}flag')
          echo "Found issue section:"
          echo "$ISSUE_SECTION"

          # Extract only valid #number
          ISSUES=$(echo "$ISSUE_SECTION" | grep -oE '#[0-9]+' | tr -d '#' | tr '\n' ' ')
          echo "issues=$ISSUES" >> $GITHUB_OUTPUT

      - name: 🧪 Check issue statuses in Project
        env:
          PROJECT_ID: "PVT_xxx" # 🔁 Thay bằng project ID thực tế
          FIELD_NAME: "Status"
          EXPECTED_OPTION_ID: "xxxxxx" # 🔁 Thay bằng option ID của trạng thái 'Code Review'
        run: |
          ISSUES="${{ steps.extract.outputs.issues }}"
          echo "Checking issues: $ISSUES"

          RESPONSE=$(gh api graphql -f query='
          {
            node(id: "'$PROJECT_ID'") {
              ... on ProjectV2 {
                items(first: 100) {
                  nodes {
                    id
                    content {
                      ... on Issue {
                        number
                      }
                    }
                    fieldValues(first: 10) {
                      nodes {
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          field {
                            ... on ProjectV2SingleSelectField {
                              name
                            }
                          }
                          optionId
                        }
                      }
                    }
                  }
                }
              }
            }
          }')

          FAILED=0

          for issue in $ISSUES; do
            echo "🔎 Checking issue #$issue"
            OPTION_ID=$(echo "$RESPONSE" | jq -r --arg num "$issue" --arg fname "$FIELD_NAME" '
              .data.node.items.nodes[]
              | select(.content.number == ($num | tonumber))
              | .fieldValues.nodes[]
              | select(.field.name == $fname)
              | .optionId')

            if [[ "$OPTION_ID" == "$EXPECTED_OPTION_ID" ]]; then
              echo "✅ Issue #$issue is in '$FIELD_NAME: Code Review'"
            else
              echo "❌ Issue #$issue is not in expected status. Found option ID: $OPTION_ID"
              FAILED=1
            fi
          done

          if [[ $FAILED -eq 1 ]]; then
            echo "🔴 One or more issues are not in the required status."
            exit 1
          else
            echo "🟢 All issues are in 'Code Review'"
          fi
